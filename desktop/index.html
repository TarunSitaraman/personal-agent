<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 128px; height: 138px; overflow: hidden; background: transparent; user-select: none; }

    #root { position: relative; width: 128px; height: 138px; }

    /* Quick-action strip above pet — shown on hover */
    #actions {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    #root:hover #actions, #actions.pinned { opacity: 1; pointer-events: all; }

    .action-btn {
      width: 28px; height: 28px;
      background: rgba(15,15,20,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .action-btn:hover { background: rgba(79,142,247,0.4); }
    .action-btn.active { background: rgba(79,142,247,0.6); }

    #pet {
      width: 128px; height: 138px;
      cursor: pointer;
      image-rendering: pixelated;
      -webkit-app-region: no-drag;
      display: block;
    }

    /* Speech bubble */
    #bubble {
      position: fixed;
      bottom: 146px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,20,0.95);
      color: #fafafa;
      font: 11px/1.45 -apple-system, sans-serif;
      padding: 7px 11px;
      border-radius: 10px;
      border-bottom-right-radius: 2px;
      max-width: 200px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 20;
    }
    #bubble.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="root">
    <div id="actions">
      <button class="action-btn" id="btn-chat"   title="Chat">💬</button>
      <button class="action-btn" id="btn-todos"  title="Todos">📋</button>
      <button class="action-btn" id="btn-events" title="Events">🗓️</button>
    </div>
    <img id="pet" src="" draggable="false" />
  </div>
  <div id="bubble"></div>
  <script src="pet.js"></script>
</body>
</html>
